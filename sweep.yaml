# Program to run for the sweep
program: train.py

# Method for the sweep
method: grid

# Metric to optimize
metric:
  goal: maximize
  name: eval_ko_in/final_hard_accuracy

# Ablation Study: Test "Architect" vs "Technician" Hypothesis
# This sweep compares models with and without loss feedback during evaluation
# to determine if generalization is structural or relies on test-time optimization

# Parameters to sweep over
parameters:
  # ABLATION: Blind Mode (Loss Feedback)
  eval.blind_mode:
    values:
      - false  # Normal: Model sees loss signal (Technician mode)
      - true   # Blind: Model cannot see loss signal (Architect mode)
  
  # Optional: Test with input split to verify unseen combo generalization
  eval.input_split_enabled:
    values:
      - true   # Enable train/test split on input combinations
      
  eval.input_train_fraction:
    values:
      - 0.8   # 80% train, 20% test



# Add this command block to format arguments correctly for Hydra
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}