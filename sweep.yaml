  #     - 0.15
  #     - 0.2

  # Self-attention model parameters (biggest impact on parameter count)
  # attention_dim has QUADRATIC impact (~96.6% of total params)
  model.attention_dim:
    values:
      - 64
      - 128  # 75% reduction in attention params vs 256
      - 256  # baseline (current)

  # num_layers has LINEAR impact (direct multiplier)
  model.num_layers:
    values:
      - 2    # 50% reduction vs 4 layers
      - 4    # baseline (current)

