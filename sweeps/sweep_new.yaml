# Define parameter sweeps
defaults:
  - override hydra/launcher: basic

sweep:
  grid:  # parameters to combine in all possible ways
    model: [gnn, self_attention]
    training.loss_type: [bce]
    training.learning_rate: [3e-4, 1e-4]
    training.n_message_steps: [50]
    circuit: [add, binary_multiply, text]