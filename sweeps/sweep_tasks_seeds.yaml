# Task and Seed Sweep
# This sweep varies both the task and random seed to collect performance data
# across different tasks and multiple seeds for statistical robustness.
# Useful for comparing model performance across tasks and computing error bars.

# Program to run for the sweep (relative to project root where wandb sweep is run)
program: train.py

# Method for the sweep
method: grid

# Metric to track (not optimizing, just for comparison)
metric:
  goal: maximize
  name: eval_no_damage/final_hard_accuracy

# Parameters to sweep over
parameters:
  # Vary model initialization seed (primary source of stochasticity)
  seed:
    values:
      - 34
      - 42
      - 123
      - 456
      - 789

  # set input split to true
  eval.input_split_enabled:
    value: true
  
  # Vary the boolean circuit task
  circuit.task:
    values:
      # - "parity"           # Parity (odd/even number of 1s)
      - "reverse"          # Reverse bits
      - "and"              # Bitwise AND
      - "xor"              # Bitwise XOR
      - "add"              # Binary addition
      - "binary_multiply"  # Binary multiplication
      # Uncomment additional tasks if desired:
      # - "identity"        # Identity function
      # - "copy"            # Copy (same as identity)
      # - "gray"            # Gray code conversion
      # - "popcount"        # Population count (count 1s)

      
  
  # Ensure stepwise logging is enabled for statistical aggregation
  eval.periodic_eval_log_stepwise:
    value: true
  
  # DISABLE ALL DAMAGE-RELATED SETTINGS
  # Disable damage during training (pool damage)
  pool.damage_pool_enabled:
    value: false
  
  # Explicitly disable knockout evaluation (damage testing)
  eval.knockout_eval.enabled:
    value: false
  
  # Use growth mode instead of repair mode (repair mode is for damage recovery)
  training.training_mode:
    value: "growth"
  
  # Disable backprop knockout vocabulary (if backprop is enabled)
  backprop.knockout_vocabulary.enabled:
    value: false

# Add this command block to format arguments correctly for Hydra
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}

