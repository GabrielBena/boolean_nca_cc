# Program to run for the sweep (relative to project root where wandb sweep is run)
program: train.py

# Method for the sweep
method: grid

# Metric to optimize
metric:
  goal: maximize
  name: eval_ko_in/final_hard_accuracy

# Sweep over number of layers (num_layers) with values smaller than default (3)
# Testing how number of layers affects model performance

# Parameters to sweep over
parameters:
  model.num_layers:
    values:
      - 1
      - 2
      - 3



# Add this command block to format arguments correctly for Hydra
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}