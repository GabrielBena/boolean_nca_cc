# Define parameter sweeps
defaults:
  - override hydra/launcher: basic

sweep:
  grid:  # parameters to combine in all possible ways
    seed: [0, 1, 2, 4, 5]
    circuit: [reverse_large, add_large, binary_multiply_large]


    # FIXED PARAMETERS
    # model: [self_attention]
    model: [gathered_attention]
    model.attention_dim: [96]
    pool.noise_scale: [0.1]
    training.wiring_mode: [random]
    training.epochs_power_of_2: [17]
    training.n_message_steps: [5]
    training.learning_rate: [2e-4]
    training.meta_batch_size: [512]
    damage.target_damage_fraction : [0.05]

  paired:
    - damages:
        damage.enabled : [false, true]
        damage.permanent : [false, "random"]

        