# Baseline: horizon loss and message-steps schedule OFF (false, false).
# Fixed training.n_message_steps, single-step loss at final step.
#
# Usage: python train.py --config sweeps/singles/low_footprint_baseline.yaml

defaults:
  - _self_

seed: ${test_seed}
test_seed: 24
damage_seed: 481

output:
  dir: null

wandb:
  enabled: true
  project: "boolean-nca-cc"
  entity: marcello-barylli-growai
  run_name: null
  tags: ["boolean-circuit", "nca", "meta-learning"]
  group: null

model:
  _target_: boolean_nca_cc.models.CircuitSelfAttention
  type: self_attention
  attention_dim: 128
  mlp_dim: null
  mlp_dim_multiplier: 2
  num_heads: 4
  num_layers: 3
  dropout_rate: 0.0
  zero_init: false
  re_zero_update: true
  damage_behavior: reversible
  reversible_bias: -10
  circuit_hidden_dim: 64

circuit:
  task: "add"
  input_bits: 8
  output_bits: 8
  arity: 4
  num_layers: 3
  layer_sizes: null
  circuit_hidden_dim: 64
  max_task_samples: 100000

training:
  training_mode: "repair"
  n_message_steps: 6
  random_loss_step: true
  random_loss_step_min: 4
  random_loss_step_min_fraction: 0.6
  long_horizon_enabled: false  # baseline: horizon loss off
  long_horizon_size: 3
  layer_neighbors: false
  loss_type: "l4"
  meta_batch_size: 64
  learning_rate: 2e-4
  weight_decay: 1e-5
  lr_scheduler: "linear_warmup"
  lr_scheduler_params:
    warmup_steps_factor: 50
    lr_warmup_start: 1e-6
    exponent: 1
    alpha: 1e-1
  epochs: 8193
  use_scan: true
  message_steps_schedule:
    enabled: false  # baseline: fixed n_message_steps (training.n_message_steps)
    type: "step"
    initial_steps: 5
    final_steps: 100
    step_intervals: [4096, 6144]
    step_values: [5, 30, 100]
    constant_product: 1280

pool:
  size: 1024
  reset_fraction: 0.15
  reset_interval: 128
  reset_strategy: "combined"
  combined_weights: [0.5, 0.5]
  damage_pool_enabled: true
  damage_pool_interval: 128
  damage_pool_fraction: 0.15
  damage_strategy: "loss_biased"
  damage_combined_weights: [0.5, 0.5]
  damage_mode: "shotgun"
  damage_prob: 40
  damage_knockout_diversity: 64
  damage_injection_mode: "multi"
  max_damage_per_circuit: 5
  damage_eval_steps: ${eval.periodic_eval_inner_steps}
  greedy_ordered_indices: [53,12,167,31,67,46,69]
  greedy_window_size: ${pool.damage_prob}

eval:
  periodic_eval_enabled: true
  periodic_eval_inner_steps: 300
  periodic_eval_interval: 1024
  periodic_eval_test_seed: ${test_seed}
  periodic_eval_log_stepwise: true
  periodic_eval_batch_size: ${pool.damage_knockout_diversity}
  blind_mode: true
  input_split_enabled: false
  input_train_fraction: 0.8
  input_split_seed: ${seed}
  knockout_eval:
    enabled: ${pool.damage_pool_enabled}
    damage_prob: ${pool.damage_prob}
    damage_mode: ${pool.damage_mode}
    damage_injection_mode: "single"
    max_damage_per_circuit: 1
    greedy_window_size: ${pool.greedy_window_size}
    greedy_injection_recover_steps: 30
    damage_start_offset: 5
    damage_start_offset_random: false
    damage_start_offset_seed: ${test_seed}
  hamming_analysis_dir: "results/hamming_analysis_mbs${training.meta_batch_size}_div${pool.damage_knockout_diversity}_dam${pool.damage_prob}"
  track_pool_damage_validation: false
  final_eval_enabled: true
  final_eval_inner_steps: 500

logging:
  log_interval: 16
  level: "INFO"

checkpoint:
  enabled: true
  interval: 1031
  save_best: true
  best_metric: "hard_accuracy"
  best_metric_source: "eval_ko_in"
  save_stable_states: false

early_stop:
  enabled: false
  threshold: 1
  metric: "hard_accuracy"
  source: ${checkpoint.best_metric_source}
  patience: 2
  min_epochs: 3072

backprop:
  enabled: true
  epochs: 200
  learning_rate: 1
  weight_decay: 1e-1
  optimizer: "adamw"
  beta1: 0.8
  beta2: 0.8
  parallel: true
  batch_size: null
  knockout_vocabulary:
    enabled: ${pool.damage_pool_enabled}
    size: ${pool.damage_knockout_diversity}
    damage_prob: ${pool.damage_prob}
