# Matches WandB run config (seed 24, multi KO eval, dam40) for parallel injection-mode verification.
# Baseline: eval.knockout_eval.damage_injection_mode=multi (fixed-interval reinjection).
# Threshold: override with eval.knockout_eval.damage_injection_mode=threshold_reinject
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 python train.py --config-path=sweeps/singles --config-name=verify_eval_injection_seed24 \
#     wandb.run_name=verify_inj_multi_s24 wandb.group=verify_ko_inj hydra.run.dir=outputs/verify_inj_multi_s24
#   CUDA_VISIBLE_DEVICES=1 python train.py --config-path=sweeps/singles --config-name=verify_eval_injection_seed24 \
#     eval.knockout_eval.damage_injection_mode=threshold_reinject wandb.run_name=verify_inj_thresh_s24 \
#     wandb.group=verify_ko_inj hydra.run.dir=outputs/verify_inj_thresh_s24

seed: 24
test_seed: 24
damage_seed: 481

output:
  dir: null

wandb:
  tags: [boolean-circuit, nca, meta-learning]
  group: null
  entity: marcello-barylli-growai
  enabled: true
  project: boolean-nca-cc
  run_name: null

circuit:
  task: add
  arity: 4
  input_bits: 12
  num_layers: 3
  layer_sizes: [[12, 1], [96, 4], [96, 4], [48, 2], [12, 1]]
  output_bits: 12
  max_task_samples: 100000
  circuit_hidden_dim: 64

model:
  _target_: boolean_nca_cc.models.CircuitSelfAttention
  type: self_attention
  attention_dim: 128
  mlp_dim: null
  mlp_dim_multiplier: 2
  num_heads: 8
  num_layers: 1
  dropout_rate: 0
  zero_init: false
  re_zero_update: true
  damage_behavior: reversible
  reversible_bias: -10
  circuit_hidden_dim: ${circuit.circuit_hidden_dim}

logging:
  level: INFO
  log_interval: 16

training:
  epochs: 12288
  use_scan: true
  use_remat: true
  loss_type: l4
  lr_scheduler: linear_warmup
  weight_decay: 0.00001
  learning_rate: 0.0002
  training_mode: repair
  layer_neighbors: false
  meta_batch_size: 64
  n_message_steps: 6
  random_loss_step: true
  random_loss_step_min: 4
  random_loss_step_min_fraction: 0.6
  long_horizon_enabled: true
  long_horizon_size: 3
  message_steps_schedule:
    type: step
    enabled: false
    final_steps: 100
    step_values: [5, 40, 160]
    initial_steps: 5
    step_intervals: [4096, 8192]
    constant_product: null
  lr_scheduler_params:
    alpha: 0.1
    exponent: 1
    lr_warmup_start: 0.000001
    warmup_steps_factor: 50

pool:
  size: 1024
  damage_mode: shotgun
  damage_prob: 40
  reset_fraction: 0.15
  reset_interval: 128
  reset_strategy: combined
  damage_strategy: loss_biased
  combined_weights: [0.5, 0.5]
  damage_eval_steps: 250
  greedy_window_size: 40
  damage_pool_enabled: true
  damage_pool_fraction: 0.15
  damage_pool_interval: 128
  damage_injection_mode: multi
  greedy_ordered_indices: [53, 12, 167, 31, 67, 46, 69]
  max_damage_per_circuit: 20
  damage_combined_weights: [0.5, 0.5]
  damage_knockout_diversity: 256

eval:
  blind_mode: true
  knockout_eval:
    enabled: true
    damage_mode: shotgun
    damage_prob: 40
    greedy_window_size: 40
    damage_start_offset: 5
    damage_injection_mode: threshold_reinject
    max_damage_per_circuit: 9
    damage_start_offset_seed: 24
    damage_start_offset_random: false
    greedy_injection_recover_steps: 10
    reinject_threshold: 0.99
    reinject_cooldown_steps: 10
  input_split_seed: 24
  final_eval_enabled: true
  input_split_enabled: false
  hamming_analysis_dir: results/hamming_analysis_mbs64_div256_dam40
  input_train_fraction: 0.8
  periodic_eval_enabled: true
  final_eval_inner_steps: 1000
  periodic_eval_interval: 1024
  periodic_eval_test_seed: 24
  periodic_eval_batch_size: 256
  periodic_eval_inner_steps: 250
  periodic_eval_log_stepwise: true
  track_pool_damage_validation: false

checkpoint:
  enabled: true
  interval: 1031
  save_best: true
  best_metric: hard_accuracy
  best_metric_source: eval_ko_in
  save_stable_states: false

early_stop:
  metric: hard_accuracy
  source: ${checkpoint.best_metric_source}
  enabled: false
  patience: 2
  threshold: 1
  min_epochs: 3072

backprop:
  beta1: 0.8
  beta2: 0.8
  epochs: 200
  enabled: true
  parallel: true
  optimizer: adamw
  batch_size: null
  weight_decay: 0.1
  learning_rate: 1
  knockout_vocabulary:
    size: ${pool.damage_knockout_diversity}
    enabled: true
    damage_prob: ${pool.damage_prob}
