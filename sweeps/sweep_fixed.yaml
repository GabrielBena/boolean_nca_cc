# Define parameter sweeps
defaults:
  - override hydra/launcher: basic


sweep:
  grid:  # parameters to combine in all possible ways

    seed: [0, 1, 2]
    
    training.wiring_mode: [fixed, random]
    circuit: [reverse_large, add_large, binary_multiply_large]

    # FIXED PARAMETERS
    model: [perceiver_attention]
    circuit.circuit_hidden_dim: [64]
    model.attention_dim: [64]
    pool.noise_scale: [0.1]
    training.epochs_power_of_2: [16]
    training.n_message_steps: [5]
    training.learning_rate: [3e-4]
    training.meta_batch_size: [128]
    damage.target_damage_fraction: [0.1]
    pool.expected_updates: [128]
    damage.enabled: [true]
