# Damage Scale Sweep
# This sweep varies damage_prob to test how different damage scales affect model performance
# and recovery capabilities.

# WandB project name (WandB normalizes hyphens/underscores, but we specify explicitly)
project: boolean-nca-cc

# Program to run for the sweep (relative to project root where wandb sweep is run)
program: train.py

# Method for the sweep
method: grid

# Metric to optimize
metric:
  goal: maximize
  name: eval_ko_in/final_hard_accuracy

# Parameters to sweep over
parameters:
  pool.damage_prob:
    values:
      - 1
      - 10
      - 20
      - 40
      - 60
      - 80
      - 120
      - 140
      - 160

# Add this command block to format arguments correctly for Hydra
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
