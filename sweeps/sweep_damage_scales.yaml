# Damage Scale Sweep
# This sweep varies damage_prob to test how different damage scales affect model performance
# and recovery capabilities.

# Program to run for the sweep (relative to project root where wandb sweep is run)
program: train.py

# Method for the sweep
method: grid

# Metric to optimize
metric:
  goal: maximize
  name: eval_ko_in/final_hard_accuracy

# Parameters to sweep over
parameters:
  pool.damage_prob:
    values:
      - 1
      - 10
      - 20
      - 40
      - 60
      - 80
      - 100
      - 160
  # Single damage mode: only one damage event per circuit during training and eval
  pool.damage_injection_mode:
    value: "single"
  pool.max_damage_per_circuit:
    value: 1
  eval.knockout_eval.damage_injection_mode:
    value: "single"
  eval.knockout_eval.max_damage_per_circuit:
    value: 1
# Add this command block to format arguments correctly for Hydra
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
