# =============================================================================
# Demo re-run sweep — 12×12 reverse, T=5, on S3IT (A100 via SSH-Slurm).
#
# 8 runs, each column of the `paired: run` group is ONE experiment (fully
# zipped — no cartesian product). Sized to finish before the 2026-06-03 06:00
# maintenance window (each 2^18 random run ≈ 7 h on A100; submit with
# --walltime 09:00:00 so SLURM backfills them before the reservation).
#
#   1-4: PE ABLATION on the demo cell (random + damage):
#         layer_PE | dist_pe | rwse | dist_pe+rwse   (#4 = lead demo candidate)
#   5  : random + CLEAN (Regime III, no damage)        @ dist_pe+rwse
#   6  : max_neighbors ablation (10 -> 33)             @ dist_pe+rwse, random+damage
#   7-8: fixed-topology coherence (Regime I)           @ dist_pe+rwse, clean / damage
#         (fixed converges fast -> 2^16 + stop_accuracy early-stop)
#
# Single seed (goal = one deployable model, not paper statistics).
# Shuffle stays DISABLED (the demo's shuffle interaction must remain true-OOD).
# =============================================================================
defaults:
  - override hydra/launcher: basic

sweep:
  grid:
    seed: [0]
    circuit: [twelve]
    tasks: [reverse]
    model: [gathered_attention]
    model.attention_dim: [128]
    circuit.circuit_hidden_dim: [64]
    training.n_message_steps: [5]
    training.data_per_batch: [256]
    training.meta_batch_size: [128]
    training.learning_rate: [2e-4]
    damage.target_damage_fraction: [0.10]

  paired:
    - run:
        #                            1       2       3       4       5       6       7       8
        graph.use_layer_PE:        [true,   false,  false,  false,  false,  false,  false,  false]
        graph.use_dist_pe:         [false,  true,   false,  true,   true,   true,   true,   true]
        graph.use_rwse:            [false,  false,  true,   true,   true,   true,   true,   true]
        training.wiring_mode:      [random, random, random, random, random, random, fixed,  fixed]
        training.epochs_power_of_2: [18,    18,     18,     18,     18,     18,     16,     16]
        damage.enabled:            [true,   true,   true,   true,   false,  true,   false,  true]
        damage.permanent:          [random, random, random, random, random, random, random, random]
        model.max_neighbors:       [10,     10,     10,     10,     10,     33,     10,     10]
