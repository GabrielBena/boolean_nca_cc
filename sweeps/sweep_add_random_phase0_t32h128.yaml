# =============================================================================
# Relaunch of the ONE OOM'd arm: T=32 × hidden=128 × mean_tail (was task_4 of
# sweep_add_random_phase0_gated.yaml / array 3867286). The V100 OOM was NOT a
# true >32GB need — it was BFC fragmentation (train.py forces
# XLA_PYTHON_CLIENT_PREALLOCATE=false). Fixed by XLA_PYTHON_CLIENT_MEM_FRACTION=0.9
# in the uzh-v100 pre_script (true peak ~17-19GB). batch stays 128 → the reservoir
# comparison vs task_1 (T16 h64) / task_2 (T16 h128) / task_3 (T32 h64) is clean.
#
# LAUNCH (durable — under tmux so the chain survives the local session):
#   tmux new-session -d -s hsm_t32h128 \
#     'cd <repo-root> && conda activate bool_nca && \
#      hsm sweep run -c sweeps/sweep_add_random_phase0_t32h128.yaml --mode array \
#        --remote uzh-v100 --resumable --chunk-walltime 23:00:00 \
#        --group add_random_phase0 2>&1 | tee /tmp/hsm_relaunch_t32h128.log'
# =============================================================================
defaults:
  - override hydra/launcher: basic

sweep:
  grid:
    circuit: [twelve]
    tasks: [add]
    model: [gathered_attention]
    model.attention_dim: [128]
    model.max_neighbors: [10]
    training.wiring_mode: [random]
    training.meta_batch_size: [128]
    training.data_per_batch: [256]
    training.learning_rate: [2e-4]
    training.epochs_power_of_2: [18]
    training.loss_step_mode: [mean_tail]
    training.loss_tail_fraction: [0.5]
    training.consistency_weight: [0.0]
    circuit.circuit_hidden_dim: [128]
    training.n_message_steps: [32]
    graph.use_dist_pe: [true]
    graph.use_layer_PE: [false]
    graph.use_rwse: [false]
    loss: [bce]
    damage.enabled: [false]
    shuffle.enabled: [false]
    seed: [0]
