# =============================================================================
# PROBE: does much-longer warmup + tighter grad-clip stabilize the high-T
# soft-collapse? Relaunch the diverging corner (T16) for BOTH tasks with the fix.
#
# Observed (crossed_rev_add): rev/T16 lifted to ~0.76-0.82 then PEELED BACK to
# 0.61-0.71 (mean_tail .25 + the existing clip 1.0 did NOT hold it). add/T16 sat
# stable on the 0.73 plateau (not learning, so nothing to destabilize).
#
# THE FIX (both, per G):
#   warmup_steps_factor 50 -> 5   (warmup over ~20% of training, vs ~2%; keeps lr
#                                  gentle straight through the ~ep20-30k blow-up window)
#   grad_clip_norm       1.0 -> 0.5  (tighter; the existing 1.0 clip wasn't enough)
# Everything else = the crossed-grid anchor at T16, lr2e-4, h64, burst-damage.
#
# SUCCESS = rev/T16 climbs AND HOLDS (no peel-back). Bonus = the stabilized high-T
# lets add/T16 break above 0.73 (vs the unstable arms that just diverge).
#
# LAUNCH (durable tmux):
#   hsm sweep run -c sweeps/sweep_warmupclip_probe.yaml --mode array \
#       --remote uzh-v100 --resumable --chunk-walltime 23:00:00 --group warmupclip_probe
# =============================================================================
defaults:
  - override hydra/launcher: basic

sweep:
  grid:
    circuit: [twelve]
    model: [gathered_attention]
    model.attention_dim: [128]
    model.max_neighbors: [10]
    training.wiring_mode: [random]
    training.meta_batch_size: [128]
    training.data_per_batch: [256]
    training.learning_rate: [2e-4]
    training.epochs_power_of_2: [18]
    training.loss_step_mode: [mean_tail]
    training.loss_tail_fraction: [0.25]
    training.n_message_steps: [16]
    circuit.circuit_hidden_dim: [64]
    training.lr_scheduler_params.cosine.warmup_steps_factor: [5]   # FIX: ~10x longer warmup
    training.grad_clip_norm: [0.5]                                 # FIX: tighter clip (was 1.0)
    graph.use_dist_pe: [true]
    graph.use_layer_PE: [false]
    graph.use_rwse: [false]
    loss: [bce]
    shuffle.enabled: [false]
    demo_probe.enabled: [false]
    damage.enabled: [true]
    damage.target_damage_fraction: [0.10]
    damage.permanent: [random]
    damage.burst.enabled: [true]
    damage.burst.damage_share: [1.0]

  paired:
    - run:
        tasks: [reverse, add]
        seed:  [0,       0]
