# Main Hydra configuration file for Boolean NCA training

# Default parameters for experiment
defaults:
  - model: gathered_attention  # Default model (gnn or self_attention or perceiver_attention)
  - circuit: large  # Circuit topology only — size: small / mid / large
  - tasks: reverse  # What the circuit should compute. Fixed: reverse / add /
                    # binary_multiply / identity / parity / text. Sampler: k_junta.
  - loss: bce  # Options: l2, l4, bce, bce_w3, focal, asym, focal_asym
  - _self_  # For self-overrides

# Random seed for reproducibility
seed: 0 # Seed for training
eval_seed: null # Seed for evaluation (derived from training seed if null)

# Output configuration
output:
  dir: null  # Output directory (null means use current working directory)

# Wandb configuration
wandb:
  enabled: true
  project: "boolean-nca-cc"
  entity: gbena  # Your wandb username or team name
  run_name: null  # Auto-generated if null
  tags: ["boolean-circuit", "nca", "meta-learning"]
  group: null
  dir: null  # Output directory (null means use current working directory)

# Graph configuration — single source of truth for all node-feature toggles.
# Model configs interpolate from here via ${graph.*}, so the build_graph computation
# and the model's feature_proj input dim always agree.
graph:
  # --- Topology ---
  neighboring_connections: false  # Add intra-layer adjacent edges
  bidirectional_edges: true       # Mirror forward wires as backward edges

  # --- Per-node features (model consumes if flag is on) ---
  # All are stored in graph.nodes; the model's ``extract_node_features`` decides
  # which to concatenate into the attention input. Per-model overrides are still
  # possible (e.g. perceiver disables use_node_loss because it gets per-sample
  # residuals through cross-attention).
  use_node_loss: true              # Per-node scalar loss as a feature

  # Sinusoidal layer-position PEs — always emitted by build_graph (cheap).
  use_layer_PE: false               # Normalised depth-fraction PE (the brittle one)
  use_intra_layer_PE: false        # Absolute gate index within a layer (deprecated for random wirings)

  # Graph-derived PEs — only computed by build_graph when their flag is on
  # (more expensive than the layer PEs).
  # dist_pe: sinusoidal encoding of (dist_from_input, dist_to_output) on the
  # directed DAG. Absolute, directional, scale-free across depth changes —
  # the principled fix for the normalised-depth brittleness.
  use_dist_pe: true
  # rwse: Random Walk Structural Encoding. Per-node K-vector of return
  # probabilities on the bidirectional graph. Pure topology signature that
  # disambiguates gates with identical graph distances.
  # NOTE: the web demo's TS runtime has no RWSE support — export/extract_weights.py
  # raises on any checkpoint trained with use_rwse=True. If you're training a
  # checkpoint you intend to deploy to web_demo/, override use_rwse=false.
  use_rwse: true
  rwse_k: 8                        # RWSE walk length / feature dim

# Training parameters
training:
  wiring_mode: "random"  # Options: "fixed", "genetic", or "random"
  # Diversity will always be fully random for random mode. This controls number of different wirings for fixed.
  initial_diversity: 1
  # INNER LOOP
  n_message_steps: 10  # Number of message passing steps per training iteration
  # DATA FRACTION
  data_per_batch: 128  # Number of data points per batch (null means use all data)
  # RANDOM LOSS STEP
  random_loss_step: false  # Use random message passing step for loss computation
  random_loss_step_min: 2
  use_beta_loss_step: false  # Use beta distribution for random loss step (varies from early to late steps through training)
  # TAIL-MEAN LOSS (path constraint: reach the solution AND hold it)
  # null = legacy behavior (flags above). "mean_tail" = loss is the MEAN over the
  # last ceil(loss_tail_fraction * n_message_steps) steps — anti-limit-cycle
  # pressure; metrics still report the final step.
  loss_step_mode: null
  loss_tail_fraction: 0.5
  # Optional: penalize (soft) prediction churn between consecutive tail steps —
  # the differentiable counterpart of the demo flip-rate. 0.0 = off.
  consistency_weight: 0.0
  # Pool-return depth for mean_tail (decoupled from the loss): "final" = circuits
  # re-enter the pool at step T; "random_tail" = at a random tail step (async pool
  # maturities — the intentional side-effect of legacy random_loss_step, isolated).
  pool_return_step: "final"
  # INNER-LOOP REGIME — one continuum (run_inner_loop), or the legacy demo/damage scan.
  # "batch" (default) = the legacy batch meta-gradient via run_model_scan_with_loss, which
  #   carries the demo/damage/shuffle/burst machinery (byte-for-byte unchanged). Use for the
  #   demo / recovery / repair arc.
  # "unified" = the UNIFIED online↔batch continuum via run_inner_loop, parameterized by the
  #   dials below. data_mode="stream" = the VSML online inner loop (predict-before-adapt
  #   emerges); data_mode="fixed" = the (damage-free) batch inner loop (reproduces the batch
  #   scan's no-damage core). REQUIRES tasks.type=sampler (per-circuit truth tables; k_junta
  #   or arith_family) — raises otherwise. (Legacy value "online" is accepted = unified+stream.)
  inner_loop_regime: batch          # batch (legacy/demo) | unified (continuum)
  data_mode: stream                 # unified only: stream (online, per-step) | fixed (batch, per-rollout)
  n_rounds: 64                      # N: inner-loop rounds (online stream positions / batch steps)
  # Optional n_rounds curriculum: null = constant n_rounds. Else a list of [epoch_fraction, N]
  # steps, e.g. [[0.0, 8], [0.15, 16], [0.4, 32], [0.7, 64]] — few rounds early (cheap), full
  # count late. Stepped → only a few jit recompiles. Eval always uses the MAX N.
  # Sweep override: 'training.n_rounds_schedule=[[0,8],[0.4,32],[0.7,64]]'.
  n_rounds_schedule: null
  steps_per_round: 1                # m: NCA message-passing steps per round (k in the VSML form)
  window_size: 1                    # W: inputs evaluated per round (1 = pure online for stream)
  loss_reduction: mean              # mean | mean_tail | final  (reduction over the N round losses)
  # TRAIN/TEST SPLIT
  test_num: 256  # Fraction/absolute number of data to use for testing (from all input combinations)
  # BATCH SIZE
  meta_batch_size: 256
  
  # MULTI-GPU DATA PARALLELISM
  # Distributes batch across GPUs, each device processes batch_size/num_devices circuits
  # Gradients are automatically synchronized via all-reduce
  multi_gpu:
    enabled: false  # null = auto (enable if >1 GPU available), true/false = explicit
    num_devices: null  # Number of devices to use (null = all available)
  
  # OPTIMIZATION
  learning_rate: 2e-4
  weight_decay: 1e-5
  # optax global-norm gradient clip. 1.0 = existing behavior; lower (0.3-0.5)
  # to stabilize long horizons (high T soft-collapse). betatest 2026-06-09.
  grad_clip_norm: 1.0
  # LEARNING RATE SCHEDULER
  # Options: "constant", "exponential", "cosine", "linear_warmup", "adaptive", "reduce_on_plateau"
  lr_scheduler: "linear_warmup"  # Loss-aware scheduler - reduces LR when loss plateaus
  lr_scheduler_params:
    
    # === For exponential decay ===
    exponential:
      decay_rate: 0.9

    # === For linear_warmup (default cosine decay after warmup) ===
    cosine:
      warmup_steps_factor: 50
      lr_warmup_start: 1e-6
      exponent: 1  # Quadratic decay - faster initial drop, slower at end
      alpha: 0.1  # final lr = 1% of initial lr
    
    # === For reduce_on_plateau (simple, effective) ===
    plateau:
      factor: 0.5        # Multiply LR by this when plateau detected
      patience: 200      # Epochs to wait before reducing LR
      threshold: 1e-4    # Minimum relative improvement to count as progress
      cooldown: 100      # Epochs to wait after reduction before allowing another
      lr_min: 1e-8       # Minimum LR floor
      max_reductions: 8  # Maximum number of LR reductions
    
    # === For adaptive (advanced loss-aware scheduler) ===
    adaptive:
      lr_start: 1e-8        # Starting LR for warmup
      lr_max: 1e-4          # Maximum LR target
      lr_min: 1e-9          # Minimum LR floor
      warmup_rate: 1.005     # Geometric rate for LR increase during warmup
      decay_factor: 0.5     # Factor to reduce LR by during decay
      variance_threshold: 0.1  # Relative variance threshold for instability
      rebound_threshold: 0.05  # Loss increase % to trigger decay
      patience: 500         # Epochs before plateau detection triggers decay
      min_warmup_epochs: 2500  # Minimum epochs in warmup phase


  # NUMBER OF EPOCHS
  epochs: null
  epochs_power_of_2: 19 # 2^n
  # MID-TRAINING RESUME (bit-faithful)
  # Path to a latest_checkpoint.pkl written by the resume-aware checkpoint path
  # (periodic save / SIGTERM preemption hook). When set, model + optimizer +
  # circuit pool + carried train_key + epoch/reset-phase + best/early-stop
  # trackers are restored and training continues from epoch+1. null = fresh run.
  # Keep `epochs` identical to the original run for a faithful schedule.
  resume_from: null
  # USE SCAN
  use_scan: true
  # GRADIENT CHECKPOINTING (remat)
  # Trades compute for memory by recomputing model activations during backward pass
  # Useful when n_message_steps is high or batch size is large and you're running out of memory
  # In practice it looks like it's FASTER with gradient checkpointing enabled... And the memory saves are huge.
  gradient_checkpointing: true
  # Debugging
  check_gradients: false # Whether to check gradients for zero values. This will also disbale JIT, useful for debug points.

# Pool configuration for meta-learning
pool:
  noise_scale: 0.1

  # size: 8192
  size: 4096
  reset_fraction: 0.15  # Reduced from 0.25
  reset_interval: null
  reset_strategy: "uniform"
  combined_weights: [0.5, 0.5] # Weights for [loss, steps] in combined reset strategy
  
  # Automatic parameter computation based on target expected updates
  # If expected_updates is specified and some parameters above are null, 
  # the system will automatically compute the missing parameter(s)
  expected_updates: 256  # Target expected updates per circuit (e.g., 50.0)
  
  # Genetic mutation parameters
  mutation_rate: 1e-3 # For genetic mutation rate
  n_swaps_per_layer: null # For genetic mutation number of swaps per layer
  initial_diversity: ${training.initial_diversity} # For genetic mutation number of initial wires

# Gate damage configuration for resilience testing
# Both modes target the same fraction of damaged gates for a fair comparison:
#   - Training uses p_fault (probabilistic): gates fail independently each step
#   - Evaluation uses discrete "shotgun" damage: N volleys of knockouts (OOD test)
# The single `target_damage_fraction` drives both, auto-computing p_fault and knockouts.
damage:
  enabled: true  # Master switch for damage system
  permanent: 0.5 # probability of permanent damage per step and per gate (coin flip)
  
  # === TARGET DAMAGE (the single knob) ===
  # Fraction of eligible (hidden) gates expected to be damaged by circuit reset.
  # Drives BOTH p_fault and knockouts_per_event so they are directly comparable.
  target_damage_fraction: 0.10  # e.g., 10% of hidden gates
  
  # === PROBABILISTIC (training) ===
  # Auto-computed: p_fault = 1 - (1 - target_damage_fraction)^(1/pool.expected_updates)
  # For eval, p_fault is re-derived for eval.inner_steps so the final damage matches.
  # Set explicitly to override auto-computation.
  p_fault: null
  
  # === DISCRETE "SHOTGUN" (evaluation / OOD testing) ===
  # === BURSTY BACKGROUND DAMAGE (training-only "solar events") ===
  # Doubly-stochastic p_fault: quiet base rate punctuated by short windows of
  # elevated rate (a SOFT volley — eases the eval shotgun into training while
  # keeping the literal K-gates-at-once event OOD). The target_damage_fraction
  # budget is split: bursts deliver damage_share, quiet accrual the rest.
  # Defaults (target .10): p_quiet~2e-4/tick, p_burst~6.4e-3/tick -> ~6 gates
  # spread over a 4-tick window per event, ~2 events per circuit lifecycle.
  burst:
    enabled: false
    length: 4  # ticks of elevated rate per window
    per_lifecycle: 2.0  # expected windows per circuit lifetime (pool.expected_updates ticks)
    damage_share: 0.5  # fraction of target_damage_fraction delivered by bursts

  # Number of damage volleys during evaluation stepwise run
  n_damage_steps: 2
  # Gates knocked out per volley. null = auto-computed:
  #   knockouts_per_event = ceil(target_damage_fraction * n_eligible / n_damage_steps)
  knockouts_per_event: null
  
  # === DELAYED ONSET (for repair-focused training/evaluation) ===
  # Fraction of total steps before probabilistic damage starts.
  # 0.0 = damage from the start (default). 0.5 = damage starts at 50% of steps.
  # Lets the circuit converge first, then faults start, allowing comparison
  # of "damaged without NCA repair" vs "damaged with NCA repair".
  p_fault_onset_fraction: 0.0

  # === NO-REPAIR BASELINE ===
  # Compute loss/accuracy right after damage but before the NCA runs.
  # Measures the raw damage impact, useful for quantifying NCA repair benefit.
  # Only adds overhead during evaluation (one extra circuit execution per step).
  compute_no_repair_baseline: false

  # === SHARED ===
  faulty_logit_value: -10.0  # Large negative value -> sigmoid outputs ~0

# Wire shuffle perturbation (training-only counterpart to wire_shuffle_steps in eval)
# Circuit-wide per-step Bernoulli: each step, with probability p_shuffle, the entire
# circuit's wiring is perturbed. Auto-computed from target_shuffles_per_lifecycle so
# expected events match across train/eval scan lengths.
shuffle:
  enabled: false  # Master switch for probabilistic shuffle during training

  # === TARGET (the single knob) ===
  # Expected number of shuffle events per circuit lifetime.
  # Drives p_shuffle: E[shuffles] = L * p, so p = target / L.
  target_shuffles_per_lifecycle: 2.0

  # === PROBABILISTIC (training) ===
  # Auto-computed: p_shuffle_train = target_shuffles_per_lifecycle / pool.expected_updates
  # For eval, p_shuffle_eval is derived for eval.inner_steps so expected count matches.
  # Set explicitly to override auto-computation.
  p_shuffle: null

  # === SHUFFLE FLAVOR ===
  # 1.0 (default) = full reshuffle via gen_wires (matches demo's Regime III OOD test).
  # <1.0 = each connection has shuffle_fraction probability of being reassigned
  #        (Bernoulli per entry, via training/pool/perturbation.py:shuffle_wires).
  shuffle_fraction: 1.0

  # === DELAYED ONSET ===
  # Fraction of total steps before probabilistic shuffles start (parallel to damage).
  # 0.0 = shuffles from the start. 0.5 = shuffles start at 50% of steps.
  p_shuffle_onset_fraction: 0.0

# Backpropagation baseline
backprop:
  enabled: false
  epochs: ${eval.inner_steps}
  learning_rate: 1
  weight_decay: 1e-1
  optimizer: "adamw"
  beta1: 0.8
  beta2: 0.8
  log_stepwise: false
  
# Evaluation parameters
eval:
  enabled: true  # Whether to run periodic evaluation during training
  interval: 1024  # Evaluate every N epochs
  # inner_steps: ${pool.expected_updates}  # Number of message passing steps for inner loop evaluation
  inner_steps: 256
  log_stepwise: true  # Whether to log detailed step-by-step metrics to wandb
  # batch_size_in: ${training.meta_batch_size}  # Batch size for IN-distribution evaluation (None means use initial_diversity)
  batch_size_in: 32  # Batch size for IN-distribution evaluation (None means use initial_diversity)
  # batch_size_out: ${training.meta_batch_size}  # Batch size for OUT-of-distribution evaluation (None means use meta_batch_size)
  batch_size_out: 32  # Batch size for OUT-of-distribution evaluation (None means use meta_batch_size)
  # Chunk size for the unified per-subject OOD eval (evaluate_model_inner_loop_batched):
  # process this many OOD circuits at a time to cap peak VRAM for the N-rounds-from-fresh
  # adaptation. null = vmap all batch_size_out circuits at once. Set (e.g. 16) to allow a
  # larger batch_size_out without OOM on the high-N continuum eval.
  online_chunk_size: null
  log_pool_scatter: true
  do_ood_evaluation: null # Whether to do OUT-of-distribution evaluation (None means use True if wiring_mode is random)
  get_all_wirings: true # Whether to get all wirings (True) or a subset (False)
  # Memory: when false (default), periodic eval drops the heavy
  # [batch, n_steps, ...graph] tensor + per-circuit per-step metric arrays
  # from the returned step_metrics. The cheap per-step damage fraction and
  # batch-averaged stepwise metrics are still kept, so the stepwise wandb
  # plot still renders the damage-fraction overlay correctly. Flip to true
  # if you want notebook-style access to step_metrics["graphs"] /
  # step_metrics["all_metrics"] during training (rarely needed; the OOM
  # fix relies on this defaulting to false).
  keep_full_graphs: false

# Post-training demo probe (batched — boolean_nca_cc/training/demo_probe.py).
# Runs once after training + final eval, inside the same job: scores the deploy
# checkpoint on the live-demo objective (settled accuracy / jitter over random
# topologies + carry-logits shuffle recovery). Metrics land in final_results.csv
# and wandb final/demo_* keys.
demo_probe:
  enabled: true
  which: "best"  # "best" = reload best_model_<best_metric>.pkl (falls back to final); "final" = in-memory final model
  best_metric: "eval_out_test_hard_accuracy"  # the demo's deploy-checkpoint convention (undamaged best)
  n_topologies: 64  # random topologies for the clean-settle screen
  n_pairs: 16  # topology pairs for the shuffle-recovery probe
  steps: 64  # rollout length (the demo settles well within this)
  settle_window: 8  # tail window for settled acc / jitter
  chunk_size: 32  # topologies per batched rollout (memory bound)
  # Paper protocol: shotgun_volleys volleys totalling damage.target_damage_fraction
  # of hidden gates (null = auto: ceil(0.10 * 240 / 2) = 12/volley on 12-bit).
  shotgun_gates: null  # per-volley knockouts (explicit override; 0 = skip phase)
  shotgun_volleys: 2

# Early stopping based on accuracy
stop_accuracy:
  enabled: true
  threshold: 1.0  # Accuracy threshold to trigger early stopping
  metric: "hard_accuracy"  # Which metric suffix to check ("accuracy" or "hard_accuracy")
  source: "eval"  # "eval" (checks ALL matching eval metrics) or "training" (single metric)
  scope: null  # null = require ALL eval */final_{metric} to pass (damaged + undamaged).
               # Or a list of prefixes: ["eval_in_test", "eval_damaged_in_test"]
  patience: 6  # Number of consecutive evals where ALL metrics are above threshold
  min_epochs: 1025 # Minimum number of epochs before early stopping can occur (1st eval + 1 epochs)

# Checkpointing
checkpoint:
  enabled: true
  interval: 1031  # Save checkpoints every N epochs (prime number to avoid resetting pool before)
  save_best: true
  save_latest: true  # Always save latest checkpoint
  # Save checkpoints on MNT storage (if available)
  save_on_mnt_storage: false
  # Multi-metric best model tracking - filter which metrics to track
  track_best_metrics:
    enabled: true
    # Filters: omit or leave empty to include all options
    metric: [hard_accuracy]  # Options: hard_accuracy, accuracy, hard_loss, loss
    data: []                 # Options: test, train
    wiring: []               # Options: in, out
    damaged: []              # Options: true, false
  

# Logging configuration
logging:
  log_interval: 16  # Log metrics every N epochs
  level: "INFO" 
