# Main Hydra configuration file for Boolean NCA training

# Default parameters for experiment
defaults:
  - model: self_attention  # Default model (gnn or self_attention or perceiver_attention)
  - circuit: reverse_large
  - loss: bce  # Options: l2, l4, bce, bce_w3, focal, asym, focal_asym
  - _self_  # For self-overrides

# Random seed for reproducibility
seed: 0
test_seed: 42
 
# Output configuration
output:
  dir: null  # Output directory (null means use current working directory)

# Wandb configuration
wandb:
  enabled: true
  project: "boolean-nca-cc"
  entity: gbena  # Your wandb username or team name
  run_name: null  # Auto-generated if null
  tags: ["boolean-circuit", "nca", "meta-learning"]
  group: null
  dir: null  # Output directory (null means use current working directory)

# Graph configuration
graph:
  neighboring_connections: false  # Enable neighboring connections between adjacent gates in the same layer
  bidirectional_edges: true  # Create edges in both forward and backward directions

# Training parameters
training:
  # WIRING MODE : "random" or "fixed"
  wiring_mode: "random"  # Options: "fixed", "genetic", or "random"
  # Diversity will always be fully random for random mode. This controls number of different wirings for fixed.
  initial_diversity: 1
  # INNER LOOP
  n_message_steps: 5  # Number of message passing steps per training iteration
  # DATA FRACTION
  data_per_batch: 64  # Number of data points per batch (null means use all data)
  # RANDOM LOSS STEP
  random_loss_step: false  # Use random message passing step for loss computation
  random_loss_step_min: 2
  use_beta_loss_step: false  # Use beta distribution for random loss step (varies from early to late steps through training)
  # TRAIN/TEST SPLIT
  test_num: 256  # Fraction/absolute number of data to use for testing (from all input combinations)
  # BATCH SIZE
  meta_batch_size: 128 
  
  # MULTI-GPU DATA PARALLELISM
  # Distributes batch across GPUs, each device processes batch_size/num_devices circuits
  # Gradients are automatically synchronized via all-reduce
  multi_gpu:
    enabled: null  # null = auto (enable if >1 GPU available), true/false = explicit
    num_devices: null  # Number of devices to use (null = all available)
  
  # OPTIMIZATION
  learning_rate: 5e-4
  weight_decay: 1e-5
  # LEARNING RATE SCHEDULER
  # Options: "constant", "exponential", "cosine", "linear_warmup", "adaptive", "reduce_on_plateau"
  lr_scheduler: "linear_warmup"  # Loss-aware scheduler - reduces LR when loss plateaus
  lr_scheduler_params:
    
    # === For exponential decay ===
    exponential:
      decay_rate: 0.9

    # === For linear_warmup (default cosine decay after warmup) ===
    cosine:
      warmup_steps_factor: 50
      lr_warmup_start: 1e-6
      exponent: 1  # Quadratic decay - faster initial drop, slower at end
      alpha: 0.1  # final lr = 1% of initial lr
    
    # === For reduce_on_plateau (simple, effective) ===
    plateau:
      factor: 0.5        # Multiply LR by this when plateau detected
      patience: 200      # Epochs to wait before reducing LR
      threshold: 1e-4    # Minimum relative improvement to count as progress
      cooldown: 100      # Epochs to wait after reduction before allowing another
      lr_min: 1e-8       # Minimum LR floor
      max_reductions: 8  # Maximum number of LR reductions
    
    # === For adaptive (advanced loss-aware scheduler) ===
    adaptive:
      lr_start: 1e-8        # Starting LR for warmup
      lr_max: 1e-4          # Maximum LR target
      lr_min: 1e-9          # Minimum LR floor
      warmup_rate: 1.005     # Geometric rate for LR increase during warmup
      decay_factor: 0.5     # Factor to reduce LR by during decay
      variance_threshold: 0.1  # Relative variance threshold for instability
      rebound_threshold: 0.05  # Loss increase % to trigger decay
      patience: 500         # Epochs before plateau detection triggers decay
      min_warmup_epochs: 2500  # Minimum epochs in warmup phase


  # NUMBER OF EPOCHS
  epochs: null
  epochs_power_of_2: 15 # 2^n
  # USE SCAN
  use_scan: true
  # GRADIENT CHECKPOINTING (remat)
  # Trades compute for memory by recomputing model activations during backward pass
  # Useful when n_message_steps is high or batch size is large and you're running out of memory
  # In practice it looks like it's FASTER with gradient checkpointing enabled... And the memory saves are huge.
  gradient_checkpointing: true
  # Debugging
  check_gradients: false # Whether to check gradients for zero values. This will also disbale JIT, useful for debug points.

# Pool configuration for meta-learning
pool:
  noise_scale: 0.0

  # size: 8192
  size: 4096
  reset_fraction: 0.15  # Reduced from 0.25
  reset_interval: null
  reset_strategy: "uniform"
  combined_weights: [0.5, 0.5] # Weights for [loss, steps] in combined reset strategy
  
  # Automatic parameter computation based on target expected updates
  # If expected_updates is specified and some parameters above are null, 
  # the system will automatically compute the missing parameter(s)
  expected_updates: 128  # Target expected updates per circuit (e.g., 50.0)
  
  # Genetic mutation parameters
  mutation_rate: 1e-3 # For genetic mutation rate
  n_swaps_per_layer: null # For genetic mutation number of swaps per layer
  initial_diversity: ${training.initial_diversity} # For genetic mutation number of initial wires

# Gate damage configuration for resilience testing
# Simulates permanent structural damage to gates during ongoing optimization
# Damaged gates have faulty logits and cannot receive model updates (they still emit messages to neighbors)
damage:
  enabled: false  # Master switch for damage system
  
  # Damage mode: "probabilistic" or "discrete"
  # - probabilistic: Each gate has p_fault probability of failing at each optimization step (during scan)
  mode: "probabilistic"
  permanent: true # Whether to apply permanent damage to gates (True) or temporary damage (False) or random (True/False)
  
  # === PROBABILISTIC MODE PARAMETERS === (Used for training)
  # Per-gate-per-step failure probability
  p_fault: null  # Auto-computed from expected_faulty_gates_at_reset if null
  # Target number of faulty gates when circuit is reset (used to compute p_fault)
  expected_faulty_gates_at_reset: 16
  
  # === DISCRETE MODE PARAMETERS === (Only used for visualization)
  # Damage intensity - how many gates to knock out per damage event
  knockouts_per_event: 8
  
  # === SHARED PARAMETERS ===
  # Behavior of damaged gates
  faulty_logit_value: -10.0  # Large negative value -> sigmoid outputs ~0
  
  # Protection against over-damaging circuits
  max_damage_per_circuit: null  # Max total knockouts per circuit (null = no limit)

# Backpropagation baseline
backprop:
  enabled: false
  epochs: 100 
  learning_rate: 1
  weight_decay: 1e-1
  optimizer: "adamw"
  beta1: 0.8
  beta2: 0.8
  
# Evaluation parameters
eval:
  enabled: true  # Whether to run periodic evaluation during training
  interval: 1024  # Evaluate every N epochs
  # inner_steps: ${pool.expected_updates}  # Number of message passing steps for inner loop evaluation
  inner_steps: 256
  log_stepwise: true  # Whether to log detailed step-by-step metrics to wandb
  # batch_size_in: ${training.meta_batch_size}  # Batch size for IN-distribution evaluation (None means use initial_diversity)
  batch_size_in: 64  # Batch size for IN-distribution evaluation (None means use initial_diversity)
  # batch_size_out: ${training.meta_batch_size}  # Batch size for OUT-of-distribution evaluation (None means use meta_batch_size)
  batch_size_out: 64  # Batch size for OUT-of-distribution evaluation (None means use meta_batch_size)
  log_pool_scatter: true
  do_ood_evaluation: null # Whether to do OUT-of-distribution evaluation (None means use True if wiring_mode is random)
  damage_enabled: true # Whether to apply damage during evaluation (if damage.enabled is also true)
  n_damage_steps: 2 # Number of damage steps to apply during evaluation
  get_all_wirings: true # Whether to get all wirings (True) or a subset (False)
  
# Early stopping based on accuracy
stop_accuracy:
  enabled: true  # Whether to enable early stopping based on accuracy
  threshold: 0.995  # Accuracy threshold to trigger early stopping
  metric: "hard_accuracy"  # Which accuracy metric to use ("accuracy" or "hard_accuracy")
  source: "eval"  # Source of the metric ("training" or "eval")
  patience: 10  # Number of epochs to wait after reaching threshold before stopping
  min_epochs: 1012 # Minimum number of epochs before early stopping can occur (eval every 512 epochs - 10 epochs)

# Checkpointing
checkpoint:
  enabled: true
  interval: 1031  # Save checkpoints every N epochs (prime number to avoid rest pool before)
  save_best: true
  save_latest: true  # Always save latest checkpoint
  # Save checkpoints on MNT storage (if available)
  save_on_mnt_storage: false
  # Multi-metric best model tracking - filter which metrics to track
  track_best_metrics:
    enabled: true
    # Filters: omit or leave empty to include all options
    metric: [hard_accuracy]  # Options: hard_accuracy, accuracy, hard_loss, loss
    data: []                 # Options: test, train
    wiring: []               # Options: in, out
    damaged: []              # Options: true, false
  

# Logging configuration
logging:
  log_interval: 16  # Log metrics every N epochs
  level: "INFO" 
