# Main Hydra configuration file for Boolean NCA training

# Default parameters for experiment
defaults:
  - model: perceiver_attention  # Default model (gnn or self_attention or perceiver_attention)
  - circuit: text_xtra_small
  - loss: bce  # Options: l2, l4, bce, bce_w3, focal, asym, focal_asym
  - _self_  # For self-overrides

# Random seed for reproducibility
seed: 0
test_seed: 42

# Output configuration
output:
  dir: null  # Output directory (null means use current working directory)

# Wandb configuration
wandb:
  enabled: true
  project: "boolean-nca-cc"
  entity: gbena  # Your wandb username or team name
  run_name: null  # Auto-generated if null
  tags: ["boolean-circuit", "nca", "meta-learning"]
  group: null
  dir: null  # Output directory (null means use current working directory)


# Graph configuration
graph:
  neighboring_connections: false  # Enable neighboring connections between adjacent gates in the same layer
  bidirectional_edges: true  # Create edges in both forward and backward directions

# Training parameters
training:
  # WIRING MODE : "random" or "fixed"
  wiring_mode: "fixed"  # Options: "fixed", "genetic", or "random"
  initial_diversity: 1
  # INNER LOOP
  n_message_steps: 30  # Number of message passing steps per training iteration
  # DATA FRACTION
  data_per_batch: 64  # Number of data points per batch (null means use all data)
  # RANDOM LOSS STEP
  random_loss_step: true  # Use random message passing step for loss computation
  use_beta_loss_step: false  # Use beta distribution for random loss step (varies from early to late steps through training)
  # TRAIN/TEST SPLIT
  test_num: 256  # Fraction/absolute number of data to use for testing (from all input combinations)
  # BATCH SIZE
  meta_batch_size: 256 
  batch_chunk_size: null  # Sequential batch processing chunk size (null means use meta_batch_size)
  # OPTIMIZATION
  learning_rate: 4e-4
  weight_decay: 1e-4
  # LEARNING RATE SCHEDULER
  lr_scheduler: "linear_warmup"  # Options: "constant", "exponential", "cosine", "linear_warmup"
  lr_scheduler_params:
    warmup_steps_factor: 50
    lr_warmup_start: 1e-6
    exponent: 1
    alpha: 1e-1 # final lr = 10% of initial lr
  # NUMBER OF EPOCHS
  epochs: null
  epochs_power_of_2: 17 # 2^n
  # USE SCAN
  use_scan: true
  # GRADIENT CHECKPOINTING (remat)
  # Trades compute for memory by recomputing model activations during backward pass
  # Useful when n_message_steps is high or batch size is large and you're running out of memory
  # In practice it looks like it's FASTER with gradient checkpointing enabled... Adn the memory saves are huge.
  gradient_checkpointing: true
  # Debugging
  check_gradients: false

# Pool configuration for meta-learning
pool:
  size: 8192
  reset_fraction: 0.25
  reset_interval: null
  reset_strategy: "uniform"  # Options: "uniform", "steps_biased", "loss_biased", "combined"
  combined_weights: [0.5, 0.5] # Weights for [loss, steps] in combined reset strategy
  
  # Automatic parameter computation based on target expected updates
  # If expected_updates is specified and some parameters above are null, 
  # the system will automatically compute the missing parameter(s)
  expected_updates: 128  # Target expected updates per circuit (e.g., 50.0)
  
  # Genetic mutation parameters
  mutation_rate: 1e-3 # For genetic mutation rate
  n_swaps_per_layer: null # For genetic mutation number of swaps per layer
  initial_diversity: ${training.initial_diversity} # For genetic mutation number of initial wires

# Gate damage configuration for resilience testing
# Simulates permanent structural damage to gates during ongoing optimization
# Damaged gates have faulty logits and cannot receive model updates
damage:
  enabled: false  # Master switch for damage system
  
  # Damage intensity - how many gates to knock out per damage event
  knockouts_per_event: 2
  
  # Damage scheduling (similar to pool reset scheduling)
  # Formula: expected_damages = (expected_updates / damage_interval) × damage_fraction
  damage_interval: 16  # Epochs between damage applications (can be auto-computed)
  damage_fraction: 0.5   # Fraction of pool to damage each interval
  
  # Automatic computation target (like pool.expected_updates)
  # If specified with one null parameter above, computes the missing one
  expected_damages: 2.0  # Target average damages per circuit before reset
  
  # Behavior of damaged gates
  faulty_logit_value: -10.0  # Large negative value → sigmoid outputs ~0
  
  # Protection against over-damaging circuits
  max_damage_per_circuit: 20  # Max total knockouts per circuit (null = no limit)

# Backpropagation baseline
backprop:
  enabled: false
  epochs: 100 
  learning_rate: 1
  weight_decay: 1e-1
  optimizer: "adamw"
  beta1: 0.8
  beta2: 0.8
  
# Evaluation parameters
eval:
  enabled: true  # Whether to run periodic evaluation during training
  interval: 1024  # Evaluate every N epochs
  inner_steps: 256  # Number of message passing steps for inner loop evaluation
  log_stepwise: true  # Whether to log detailed step-by-step metrics to wandb
  batch_size_in: null  # Batch size for IN-distribution evaluation (None means use initial_diversity)
  batch_size_out: null  # Batch size for OUT-of-distribution evaluation (None means use meta_batch_size)
  log_pool_scatter: true
  do_ood_evaluation: null # Whether to do OUT-of-distribution evaluation (None means use True if wiring_mode is random)
  damage_enabled: true # Whether to apply damage during evaluation (if damage.enabled is true)
  n_damage_steps: 2 # Number of damage steps to apply during evaluation

# Early stopping based on accuracy
stop_accuracy:
  enabled: true  # Whether to enable early stopping based on accuracy
  threshold: 0.995  # Accuracy threshold to trigger early stopping
  metric: "hard_accuracy"  # Which accuracy metric to use ("accuracy" or "hard_accuracy")
  source: "eval"  # Source of the metric ("training" or "eval")
  patience: 10  # Number of epochs to wait after reaching threshold before stopping
  min_epochs: 1012 # Minimum number of epochs before early stopping can occur (eval every 512 epochs - 10 epochs)

# Checkpointing
checkpoint:
  enabled: true
  interval: 1031  # Save checkpoints every N epochs (prime number to avoid rest pool before)
  save_best: true
  # Save checkpoints on MNT storage (if available)
  save_on_mnt_storage: false
  # Multi-metric best model tracking - specify which metrics to track and save
  track_best_metrics:
    enabled: true  # Whether to enable multi-metric tracking (in addition to the single best_metric above)
    metrics:
      # Format: "source_metric" where source is 'training', 'eval_in', or 'eval_out'
      # and metric is 'hard_accuracy', 'accuracy', 'hard_loss', or 'loss'
      - "eval_in_hard_accuracy"    # In-distribution hard accuracy (most important)
      - "eval_out_hard_accuracy"   # Out-of-distribution hard accuracy (generalization)
      # - "training_hard_accuracy"   # Training hard accuracy (uncomment if needed)
      # - "eval_in_hard_loss"        # In-distribution hard loss (uncomment if needed)
      # - "eval_out_hard_loss"       # Out-of-distribution hard loss (uncomment if needed)

# Logging configuration
logging:
  log_interval: 16  # Log metrics every N epochs
  level: "INFO" 
