# Main Hydra configuration file for Boolean NCA training

# Default parameters for experiment
defaults:
  - model: self_attention  # Default model (gnn or self_attention)
  - _self_  # For self-overrides

# Random seed for reproducibility
seed: ${test_seed}
test_seed: 24  # Perfect preconfiguration seed (hard_accuracy=1.0) for both binary_multiply and add
damage_seed: 481  # Independent seed for damage pattern generation

# Output configuration
output:
  dir: null  # Output directory (null means use current working directory)

# Wandb configuration
wandb:
  enabled: true
  project: "boolean-nca-cc"
  entity: marcello-barylli-growai  # Your wandb username or team name
  run_name: null  # Auto-generated if null
  tags: ["boolean-circuit", "nca", "meta-learning"]
  group: null

# Circuit configuration
circuit:
  task: "add"
  input_bits: 4
  output_bits: 4
  arity: 2
  num_layers: 3
  layer_sizes: null  # Auto-generate if null
  circuit_hidden_dim: 64
  max_task_samples: 100000  # Maximum number of task samples (caps exponential growth from 2^input_bits)

# Model overrides (base in configs/model/self_attention.yaml)
model:
  num_heads: 4
  num_layers: 3

# Training parameters
training:
  # TRAINING MODE
  training_mode: "repair"  # Options: "growth" (nops -> configured) or "repair" (configured -> damaged -> recovery)
  # INNER LOOP
  n_message_steps: 6  # Number of message passing steps per training iteration
  random_loss_step: true  # If true, sample random loss_step per meta-batch (instead of always using final step)
  random_loss_step_min: 4  # Minimum step for random loss_step (used only when random_loss_step_min_fraction is null)
  random_loss_step_min_fraction: 0.6  # If set (e.g. 0.7), min step = max(1, int(fraction * n_message_steps)) per epoch
  # Horizon (window) loss: mean over last H steps ending at loss_step (Step 3)
  long_horizon_enabled: true  # If true, loss = mean over long_horizon_size steps
  long_horizon_size: 3  # Window size H (static); H=1 is single-step
  # MESSAGE PASSING GRAPH AUGMENTATION
  layer_neighbors: false  # Allow attention between adjacent gates within a layer
  # LOSS TYPE
  loss_type: "l4"  # Options: "l4", "l2", or "bce"
  # BATCH SIZE
  meta_batch_size: 64
  # OPTIMIZATION
  learning_rate: 2e-4
  weight_decay: 1e-5
  # LEARNING RATE SCHEDULER
  lr_scheduler: "linear_warmup"  # Options: "constant", "exponential", "cosine", "linear_warmup"
  lr_scheduler_params:
    warmup_steps_factor: 50
    lr_warmup_start: 1e-6
    exponent: 1
    alpha: 1e-1 # final lr = 1% of initial lr
  # NUMBER OF EPOCHS
  epochs: 12288 # 32 #6144 (8193 ensures evaluation at epoch 8192 when interval=1024)
  # USE SCAN
  use_scan: true
  # Step 6: gradient checkpointing (remat) on scan body — reduces BPTT activation memory when use_scan (extra compute)
  use_remat: true
  # Message steps schedule (recompilation): when enabled, n_message_steps and optionally meta_batch_size vary per epoch
  message_steps_schedule:
    enabled: true
    type: "step"
    initial_steps: 5
    final_steps: 100
    step_intervals: [4096, 8192]
    step_values: [5, 40, 160]
    constant_product: 1280  # Optional: meta_batch_size * n_message_steps = constant (set to e.g. 6400 to scale batch with T)

pool:
  size: 1024
  reset_fraction: 0.15
  reset_interval: 128
  reset_strategy: "combined"  # Options: "uniform", "steps_biased", "loss_biased", "combined"
  combined_weights: [0.5, 0.5] # Weights for [loss, steps] in combined reset strategy

  # Sample-based damage (applied post-step, independent of resets)
  damage_pool_enabled: true
  damage_pool_interval: 128
  damage_pool_fraction: 0.15
  damage_strategy: "loss_biased"
  damage_combined_weights: [0.5, 0.5]
  damage_mode: "shotgun"  # Options: "shotgun" (random), "strip" (localized), "greedy" (rolling window), or "greedy_vocabulary" (vocabulary sampling)
  # Number of gates to knock out when generating fresh patterns (ignored if vocabulary is used)
  damage_prob: 40
  # Damage-specific vocabulary size (decoupled from legacy persistent_knockout)
  damage_knockout_diversity: 64

  # Unified damage control system
  damage_injection_mode: "multi"  # "single" (static) or "multi" (periodic)
  max_damage_per_circuit: 5       # Maximum damage events per circuit
  # Number of message passing steps for damage evaluation (baseline and recovery trajectories)
  damage_eval_steps: 300

  # Greedy damage mode configuration
  greedy_ordered_indices: [53, 12, 167, 31, 67, 46, 69]
  greedy_window_size: 40  # Rolling window size for greedy damage


eval:
  # Periodic evaluation parameters
  periodic_eval_enabled: true
  periodic_eval_inner_steps: 300
  periodic_eval_interval: 1024
  periodic_eval_test_seed: 24
  periodic_eval_log_stepwise: true
  periodic_eval_batch_size: 64

  # Ablation study: blind mode (disable loss feedback during evaluation)
  blind_mode: true  # If true, zeros out loss signal to test "Architect" vs "Technician" hypothesis

  # Input combination train/test split
  input_split_enabled: false
  input_train_fraction: 0.8
  input_split_seed: 24

  # Knockout evaluation
  knockout_eval:
    enabled: true
    damage_mode: "shotgun"
    damage_prob: 40
    greedy_window_size: 40
    damage_start_offset: 5
    damage_injection_mode: "single"
    max_damage_per_circuit: 1
    damage_start_offset_seed: 24
    damage_start_offset_random: false
    greedy_injection_recover_steps: 30

  # Hamming distance analysis
  hamming_analysis_dir: "results/hamming_analysis_mbs64_div64_dam40"
  
  # DEBUG
  # Permanent damage validation (debugging)
  track_pool_damage_validation: false  # Enable validation of permanent damage in pool (validates cumulative damage, resets, etc.)
  
  # Final BP vs SA comparison evaluation
  final_eval_enabled: true
  final_eval_inner_steps: 1000

# Logging configuration
logging:
  log_interval: 16  # Log metrics every N epochs
  level: "INFO" 

# Checkpoint configuration
checkpoint:
  enabled: true
  interval: 1031  # prime number 
  save_best: true  # Save best model based on metric
  best_metric: "hard_accuracy"  # Metric to track for best model
  best_metric_source: "eval_ko_in"  # Source for best metric: "training", "eval" (auto-fallback), "eval_ko_in", "eval_ko_out", or "eval_no_damage"
  # "eval" will automatically use eval_no_damage when knockout_eval is disabled
  save_stable_states: false  # Save last stable state before NaN loss

# Early stopping configuration
early_stop:
  enabled: false  # Enable early stopping based on accuracy threshold
  threshold: 1  # Accuracy threshold to trigger early stopping
  metric: "hard_accuracy"  # Metric to monitor: "loss", "hard_loss", "accuracy", "hard_accuracy"
  source: ${checkpoint.best_metric_source}  # Source for early stopping metric: "training", "eval" (auto-fallback), "eval_ko_in", "eval_ko_out", or "eval_no_damage"
  # "eval" will automatically use eval_no_damage when knockout_eval is disabled
  patience: 2  # Number of evaluations above threshold before stopping (since eval runs every 1024 epochs)
  min_epochs: 3072  # Minimum epochs before early stopping can trigger

# Backpropagation baseline configuration
backprop:
  enabled: true
  epochs: 200 
  learning_rate: 1
  weight_decay: 1e-1
  optimizer: "adamw"
  beta1: 0.8
  beta2: 0.8
  
  # Parallel training configuration
  parallel: true  # Enable parallel training for knockout patterns
  batch_size: null  # Batch size for parallel training (null = all patterns at once, smaller = less memory)
  
  # Knockout vocabulary configuration for backprop training
  knockout_vocabulary:
    enabled: true
    size: 64
    damage_prob: 40