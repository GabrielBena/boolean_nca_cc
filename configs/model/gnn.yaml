_target_: boolean_nca_cc.models.CircuitGNN
# Configuration for Graph Neural Network model

defaults:
  - _base

type: "gnn"

# Latent dimension — same as in self_attention.yaml for parameter-count parity
attention_dim: 96
# FFN hidden dimension: set explicitly to ~match self-attention param count
# (self_attention uses attention_dim * 2 = 192, but the GNN has an extra edge MLP
# so we use a smaller FFN to compensate)
mlp_dim: 128
mlp_dim_multiplier: 2  # only used when mlp_dim is null
mlp_n_layers: 1  # 1 hidden layer (matches self-attention's single-layer FFN)

# Message passing
message_passing: true

# Aggregation: sparse multi-head attention (set false for sum aggregation)
use_attention: true
num_heads: 8

# Per-node features and PEs — sourced from cfg.graph (single source of truth).
# The GNN model doesn't currently consume dist_pe / rwse, so those flags are not
# threaded through; add them here when graph-PE support is wired into the GNN.
use_node_loss: ${graph.use_node_loss}
use_intra_layer_PE: ${graph.use_intra_layer_PE}
use_layer_PE: ${graph.use_layer_PE}
