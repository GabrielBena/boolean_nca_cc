_target_: boolean_nca_cc.models.PerceiverCircuitAttention
# Configuration for Perceiver-style Self-Attention model with cross-attention to data

defaults:
  - _base
  - self_attention

type: "perceiver_attention"


# Cross-attention (gates query data)
num_cross_attn_layers: 1
use_input_cross_attention: true   # Cross-attend to input bit patterns
use_output_cross_attention: true  # Cross-attend to output residuals
token_pe_dim: 16                   # Sinusoidal PE dimension for sample/bit positions
                                  # Enables linking samples across input/output cross-attention
# Structural constraints (respect circuit topology)
# If true, only first gate layer can attend to inputs (mirrors circuit input flow)
restrict_input_cross_attn_to_first_layer: true
# If true, only output layer can attend to residuals (mirrors circuit output flow)
restrict_output_cross_attn_to_last_layer: true