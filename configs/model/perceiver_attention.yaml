_target_: boolean_nca_cc.models.PerceiverCircuitAttention
# Configuration for Perceiver-style Self-Attention model with cross-attention to data

defaults:
  - _base
  - self_attention

type: "perceiver_attention"


# Cross-attention (gates query data)
num_cross_attn_layers: 1
use_input_cross_attention: true   # Cross-attend to input bit patterns
use_output_cross_attention: true  # Cross-attend to output side (see signal below)
# What each output cross-attention token carries:
#   "target_and_pred" (default) — stack [y, y_hat] per output bit (2 channels).
#                                 The target y is static across recurrent steps,
#                                 giving the model a stable task reference; the
#                                 residual y - y_hat is a trivial linear combo
#                                 the encoder learns immediately.
#   "residuals"                 — original behavior: single scalar residual.
#                                 Self-quenches at convergence but no absolute
#                                 target reference.
output_cross_attn_signal: "target_and_pred"
token_pe_dim: 16                   # Sinusoidal PE dimension for sample/bit positions
                                  # Enables linking samples across input/output cross-attention

# Stochastic sample subsampling: each NCA step attends to a random subset of data samples.
# Reduces cross-attention cost from O(N_gates * N_samples * N_bits) to O(N_gates * k * N_bits).
# Promotes incremental in-context learning: the model integrates data over many recurrent steps
# rather than seeing everything at once. Set to null to attend to all samples per step.
samples_per_step: 64

# Structural constraints. The two sides are intentionally ASYMMETRIC, reflecting
# the asymmetric structure of the circuit graph:
#   - input cross-attn target = INPUT LAYER (layer == 0). The "input pins" act as
#     an address-book layer: pin i ingests a learned summary of input bit i's
#     per-sample values via cross-attention, and the first GATE layer reaches
#     that data via wire-based self-attention to its connected pins. This
#     wire-aware join is the mechanism that lets a shared-weight policy
#     reason about random wiring topologies.
#   - output cross-attn target = LAST GATE LAYER (layer == max_layer). These are
#     the real circuit-output gates; they cross-attend to residual tokens and
#     update their logits directly. One-hop loss feedback.
# Only the output-side name carries the "_gate_layer" qualifier because only
# that side actually targets a gate layer.
restrict_input_cross_attn_to_input_layer: true
restrict_output_cross_attn_to_last_gate_layer: true

# input_layer_size / output_layer_size are NOT set here — train.py injects
# them at instantiation time from the eagerly-computed layer_sizes
# (== input_n and output_n respectively). They let the cross-attention slicing
# path attend only on K queries (K << N) instead of all N nodes. They must be
# Python ints (JIT-safe gather/scatter).

# Self-attention backend among gates.
# "dense"    — O(N^2) masked MultiHeadAttention (default; matches prior behavior).
# "gathered" — O(N * max_neighbors) gathered neighborhood attention. Cross-attention
#              to data is unchanged either way (no graph topology to exploit there).
self_attn_kind: gathered
# Only used when self_attn_kind == "gathered". Must be >= max gate degree
# (typically arity + fan-out + 1 self-loop) for central gates
# (tipically arity * 2 * width_factor + 1) for input gates 
# See max_neighbors docs in gathered_attention.yaml for details.
max_neighbors: 10

# Perceiver gets per-sample residuals via output cross-attention, so the per-node
# scalar loss is redundant. Override the graph-level default (true) for this model only.
use_node_loss: false