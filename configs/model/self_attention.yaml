_target_: boolean_nca_cc.models.CircuitSelfAttention
# Configuration for Self-Attention model

defaults:
  - _base

type: "self_attention"

# Attention architecture
attention_dim: 128
mlp_dim: null  # If null, will be set to attention_dim * mlp_dim_multiplier
mlp_dim_multiplier: 2
num_heads: 4

# ReZero for updates and attention
re_zero_updates: True
re_zero_attn: True
warm_start: False

# Self-attention masks (among gates)
num_self_attn_layers: 1
use_attention_mask: true

# Per-node features and PEs — all sourced from cfg.graph (single source of truth).
# Override here per-model if a specific model needs a different setting.
use_node_loss: ${graph.use_node_loss}
use_intra_layer_PE: ${graph.use_intra_layer_PE}
use_layer_PE: ${graph.use_layer_PE}
use_dist_pe: ${graph.use_dist_pe}
use_rwse: ${graph.use_rwse}
rwse_k: ${graph.rwse_k}